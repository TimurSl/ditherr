[workspace]
resolver = "2"
members = [
    "crates/ditherr-core",
    "crates/ditherr-io",
    "crates/ditherr-3d",
    "crates/ditherr-cli",
    "crates/ditherr-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ditherr/ditherr"
authors = ["Ditherr contributors"]

[workspace.dependencies]
ditherr-core = { path = "crates/ditherr-core", version = "0.1.0" }
ditherr-io = { path = "crates/ditherr-io", version = "0.1.0" }
ditherr-3d = { path = "crates/ditherr-3d", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Dithering is per-pixel work; keep dev builds usable.
[profile.dev]
opt-level = 1
